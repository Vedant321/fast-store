[project]
name = "user-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vedant Shinde", email = "vedantve@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
]

[dependency-groups]

dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
